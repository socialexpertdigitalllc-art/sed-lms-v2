<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Contact | Ridgeline Home Services</title>
<meta name="description" content="Call or send a message to get a quote from Ridgeline Home Services.">
<meta property="og:type" content="website">
<meta property="og:title" content="Contact | Ridgeline Home Services">
<meta property="og:description" content="Call or send a message to get a quote from Ridgeline Home Services.">
<link rel="stylesheet" href="style.css">
<script src="components.js"></script>
<script src="script.js" defer></script>
</head>
<body>
<app-header></app-header>

<main id="main">

  <section class="page-hero">
    <div class="container page-hero__in">
      <nav class="crumbs" aria-label="Breadcrumb"><a href="index.html">Home</a><i data-i="chevron-right"></i><span>Contact</span></nav>
      <h1>Let's talk about <em>your project</em></h1>
      <p class="lead">Call us or send a message. We will get back to you with a clear next step.</p>
    </div>
  </section>

  <section class="section">
    <div class="container grid contact-grid">
      <div class="form-card reveal">
        <h2>Send us a message</h2>
        <p class="form-note">Tell us a little about your project and we will get back to you.</p>
        <form class="form" id="contact-form" action="https://api.web3forms.com/submit" method="POST" data-sb-form>
          <input type="hidden" name="access_key" value="YOUR_ACCESS_KEY_HERE">
          <input type="hidden" name="subject" value="New enquiry from the website">
          <input type="hidden" name="from_name" value="Website enquiry">
          <input type="checkbox" name="botcheck" class="hp" style="display:none" tabindex="-1" autocomplete="off">
          <div class="field-row">
            <div class="field"><label for="f-name">Your name</label><input id="f-name" name="name" type="text" autocomplete="name" required></div>
            <div class="field"><label for="f-phone">Phone <small>(optional)</small></label><input id="f-phone" name="phone" type="tel" autocomplete="tel"></div>
          </div>
          <div class="field"><label for="f-email">Email</label><input id="f-email" name="email" type="email" autocomplete="email" required></div>
          <div class="field">
            <label for="f-service">What do you need help with?</label>
            <select id="f-service" name="service">
              <option value="">Choose a service</option>
              <option>Repairs &amp; maintenance</option>
              <option>New installations</option>
              <option>Upgrades &amp; remodels</option>
              <option>Inspections &amp; assessments</option>
              <option>Emergency call-outs</option>
              <option>Seasonal care</option>
              <option>Something else</option>
            </select>
          </div>
          <div class="field"><label for="f-message">Your message</label><textarea id="f-message" name="message" placeholder="A few details about the job" required></textarea></div>
          <button class="btn btn--primary btn--lg btn--block" type="submit">Send message <i data-i="send"></i></button>
          <p class="form-status" role="status" aria-live="polite"></p>
        </form>
      </div>
      <aside class="stack reveal" aria-label="Contact details">
        <div class="info-card"><span class="icon-chip"><i data-i="phone"></i></span><div><small>Call us</small><a href="tel:5550100123">(555) 010-0123</a></div></div>
        <div class="info-card"><span class="icon-chip"><i data-i="mail"></i></span><div><small>Email us</small><a href="mailto:hello@ridgelinehome.example">hello@ridgelinehome.example</a></div></div>
        <div class="info-card"><span class="icon-chip"><i data-i="map-pin"></i></span><div><small>Where we work</small><span class="val">Lakeside and nearby</span></div></div>
        <div class="map">
          <iframe title="Map of our service area" src="https://www.google.com/maps?q=Lakeside&amp;output=embed" loading="lazy" referrerpolicy="no-referrer-when-downgrade"></iframe>
        </div>
      </aside>
    </div>
  </section>

</main>

<app-footer></app-footer>
</body>
</html>
